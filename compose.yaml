---
services:
  api:
    env_file: .env
    command: poetry run uvicorn src.docqa_stream.server:app --host 0.0.0.0 --port '${FASTAPI_PORT}'
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-application
    depends_on:
      - weaviate
      - t2v-transformers
    ports:
      - '${FASTAPI_PORT}:${FASTAPI_PORT}'
    restart: "on-failure"
  weaviate:
    env_file: .env
    command:
      - --host
      - 0.0.0.0
      - --port
      - '${WEAVIATE_PORT}'
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.0
    ports:
      - '${WEAVIATE_PORT}:${WEAVIATE_PORT}'
      - '${WEAVIATE_GRPC_PORT:-50051}:50051'
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: "on-failure"
    environment:
      TRANSFORMERS_INFERENCE_API: 'http://t2v-transformers:8080'
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-transformers'
      ENABLE_MODULES: 'text2vec-transformers'
      CLUSTER_HOSTNAME: 'node1'
  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-multi-qa-MiniLM-L6-cos-v1
    environment:
      ENABLE_CUDA: '0'
  pgvector:
    image: pgvector/pgvector:pg16
    profiles:
      - pgvector
    environment:
      POSTGRES_USER: '${PGVECTOR_USER:-docqa}'
      POSTGRES_PASSWORD: '${PGVECTOR_PASSWORD:-docqa}'
      POSTGRES_DB: '${PGVECTOR_DB:-docqa}'
    ports:
      - '${PGVECTOR_PORT:-5432}:5432'
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: "on-failure"
volumes:
  weaviate_data:
  pgvector_data:
