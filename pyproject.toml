[project]
name = "docqa-stream"
version = "0.2.0"
description = "Self-hosted PDF Q&A API with FastAPI, Weaviate or pgvector, streaming responses, and Azure OpenAI, OpenAI-compatible models, or Vertex AI."
authors = [{ name = "ma2za", email = "mazzapaolo2019@gmail.com" }]
readme = "README.md"
requires-python = "<3.14,>=3.11.0"
keywords = [
    "rag",
    "fastapi",
    "weaviate",
    "pgvector",
    "postgres",
    "langchain",
    "pdf-chat",
    "azure-openai",
    "vertex-ai",
    "gemini",
    "local-embeddings",
    "docker-compose",
    "streaming",
]
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "unstructured[pdf]>=0.22.6,<0.23.0",
    "langchain>=1.2.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "langchain-community>=0.4.2,<0.5.0",
    "unstructured-inference>=1.6.12,<2.0.0",
    "python-multipart>=0.0.32,<0.0.33",
]

[project.optional-dependencies]
azure = [
    "openai>=2.41.0,<3.0.0",
    "langchain-openai>=1.3.0,<2.0.0",
]
openai = [
    "openai>=2.41.0,<3.0.0",
    "langchain-openai>=1.3.0,<2.0.0",
]
vertexai = [
    "langchain-google-vertexai>=3.2.4,<4.0.0",
]
weaviate = [
    "weaviate-client>=4.21.3,<5.0.0",
    "langchain-weaviate>=0.0.6,<0.0.7",
]
pgvector = [
    "langchain-postgres>=0.0.17,<0.0.18",
]
all = [
    "openai>=2.41.0,<3.0.0",
    "langchain-openai>=1.3.0,<2.0.0",
    "langchain-google-vertexai>=3.2.4,<4.0.0",
    "weaviate-client>=4.21.3,<5.0.0",
    "langchain-weaviate>=0.0.6,<0.0.7",
    "langchain-postgres>=0.0.17,<0.0.18",
    "sentence-transformers>=5.5.1,<6.0.0",
]
local = [
    "sentence-transformers>=5.5.1,<6.0.0",
]

[tool.poetry]
packages = [{ include = "src/docqa_stream" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4,<10.0"
pyyaml = ">=6.0.1,<7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
